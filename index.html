<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storyboard → Video</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">

    <!-- ================= header ================= -->
    <header class="header">
      <div class="brand">
        <span class="brand-mark">▦</span>
        <span>Storyboard&nbsp;→&nbsp;Video</span>
      </div>
      <div class="header-divider"></div>

      <select id="boardPicker" class="board-picker" title="Open a storyboard"></select>
      <button class="btn btn-ghost btn-sm" id="btnNewBoard" title="New storyboard">New</button>
      <button class="btn btn-ghost btn-sm" id="btnImport" title="Import a storyboard JSON">Import</button>
      <button class="btn btn-ghost btn-sm" id="btnExport" title="Download this storyboard">Export</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>

      <div class="header-divider"></div>
      <div class="titles">
        <span class="project-name" id="projectTitle">—</span>
        <span class="project-meta" id="projectMeta"></span>
      </div>

      <div class="header-spacer"></div>

      <span class="save-state" id="saveState">saved</span>
      <span class="backend-badge" id="backendBadge" data-healthy="true">—</span>
      <button class="btn btn-danger" id="btnStop" disabled>Stop</button>
      <button class="btn btn-primary" id="btnRender">▶ Render all</button>
    </header>

    <!-- ================= rail ================= -->
    <aside class="rail">

      <section>
        <div class="section-label">
          Scene description
          <span class="hint">— reused every shot</span>
        </div>
        <textarea id="sceneDescription" rows="7"
          placeholder="Subject appearance and overall style — what should stay true across every shot."></textarea>
      </section>

      <section>
        <div class="section-label">
          Style references
          <span class="hint">— project-wide</span>
        </div>
        <div class="style-refs" id="styleRefs">
          <button class="style-ref-add" id="addStyleRef" title="Upload a reference image">+</button>
        </div>
        <input type="file" id="styleRefFile" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </section>

      <section>
        <div class="section-label">
          Queue
          <span class="hint">— serial, one at a time</span>
        </div>
        <div class="queue-list" id="queueList"></div>
      </section>

    </aside>

    <!-- ================= main ================= -->
    <main class="main">
      <div class="strip-wrap">
        <div class="strip-head">
          <div class="section-label" style="margin:0">
            Storyboard
            <span class="hint">— drag to reorder</span>
          </div>
        </div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="workspace">
        <section id="editor"></section>
        <section id="preview"></section>
      </div>
    </main>

  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
